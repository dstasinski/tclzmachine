name: Build and Test

on:
  push:
    branches:
      - Frobnost
  pull_request:
    branches:
      - Frobnost
  workflow_dispatch:

# A newer push makes an older run for the same branch irrelevant. Cancelling
# it conserves GitHub Actions minutes while development is moving quickly.
concurrency:
  group: tclzmachine-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow normally only reads repository contents. On direct pushes to
# Frobnost it may also commit a newly generated deterministic test-story binary.
permissions:
  contents: write

jobs:
  build-test:
    name: Ubuntu / GCC / Tcl 8.6
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            inform6-compiler \
            inform6-library \
            tcl8.6 \
            tcl8.6-dev \
            tk8.6-dev

      - name: Configure Debug build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTCLZMACHINE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run test suite
        run: ctest --test-dir build --output-on-failure

      # The current Inform 6 standard library uses V5+ language/opcode features
      # and cannot truthfully be compiled as V3. Build this full-library fixture
      # as V5; a separate compact V3 fixture will use a V3-capable library.
      - name: Compile deterministic V5 test story
        shell: bash
        run: |
          set -euo pipefail
          library_file="$(dpkg -L inform6-library | grep -E '/Parser(\.h)?$' | head -n 1)"
          if [[ -z "$library_file" ]]; then
            echo "Unable to locate the Inform 6 standard library" >&2
            exit 1
          fi
          library_dir="$(dirname "$library_file")"
          mkdir -p tests/games/compiled
          inform6 -v5 "+include_path=${library_dir}" \
            tests/games/source/tclzmachine-test.inf \
            tests/games/compiled/tclzmachine-test.z5

      # Keep the compiled fixture in GitHub, but only update it on a direct
      # Frobnost push and only when the generated bytes differ. The fixed Inform
      # serial in the source keeps normal rebuilds deterministic.
      - name: Commit updated compiled test story
        if: github.event_name == 'push' && github.ref == 'refs/heads/Frobnost'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tests/games/compiled/tclzmachine-test.z5 && \
             git ls-files --error-unmatch tests/games/compiled/tclzmachine-test.z5 >/dev/null 2>&1; then
            echo "Compiled test story is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tests/games/compiled/tclzmachine-test.z5
          if git diff --cached --quiet; then
            echo "No compiled fixture change to commit."
            exit 0
          fi
          git commit -m "Update compiled integration test story [skip ci]"
          git push origin HEAD:Frobnost

      # LastTest.log contains CTest's detailed per-test output and is especially
      # useful when the concise Actions console output is not enough to diagnose
      # a failure. Upload only on failure to avoid unnecessary artifact storage.
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tclzmachine-test-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/Testing/Temporary/LastTest.log
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
